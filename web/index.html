<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEB vs MPC (OSQP) local planners — simulation only</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0e1812; color: #e8fff2; margin: 1rem; }
      #c { background: #102018; border: 1px solid #2a4a3a; border-radius: 8px; max-width: 100%; }
      .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 0.75rem; }
      button, select { font-size: 1rem; padding: 0.35rem 0.75rem; }
      #metrics { font-family: ui-monospace, monospace; font-size: 0.9rem; }
      #honesty { max-width: 640px; color: #c6e6d4; margin: 0 0 0.75rem; }
      #legend { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; list-style: none; padding: 0; margin: 0.5rem 0 0.75rem; }
      #legend li { display: flex; align-items: center; gap: 0.4rem; }
      #legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
      #legend i.teb { background: #8fd4ff; }
      #legend i.mpc { background: #ffb88f; }
      #legend i.goal { background: #ffe566; }
      #legend i.occ { background: #3d5a4c; border-radius: 2px; }
      #legend i.mover { background: #e07a7a; }
    </style>
  </head>
  <body>
    <h1>TEB vs MPC (OSQP) local planners — simulation only</h1>
    <p id="honesty">Results come from a 2D kinematic simulation only. This is not a recorded robot, a physical vehicle, or a Nav2 controller plugin.</p>
    <div class="row">
      <label>Scenario <select id="scenario"><option value="1">S1</option><option value="2">S2</option><option value="3">S3</option><option value="4">S4</option></select></label>
      <button id="reset" type="button">Reset</button>
      <button id="play" type="button">Play</button>
      <button id="step" type="button">Step ×20</button>
    </div>
    <ul id="legend">
      <li><i class="teb"></i>TEB-style</li>
      <li><i class="mpc"></i>MPC (OSQP)</li>
      <li><i class="goal"></i>Goal</li>
      <li><i class="occ"></i>Occupied</li>
      <li><i class="mover"></i>Moving obstacle</li>
    </ul>
    <canvas id="c" width="640" height="360"></canvas>
    <pre id="metrics"></pre>
    <script src="tml_wasm.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
